rule_pack: uk_part_o_dynamic
version: 1.0.0
title: "Approved Document O (England, 2021) — dynamic thermal modelling method"
publisher: "MHCLG / HMSO"
edition: "2021 (republished 2022-02-25 with corrections per Circular 01/2022)"
inherits: uk_tm59_2017
source_status: source_verified
source_refs: [S-01, S-02]
verification_note: >-
  Part-O-specific content (window-control limits, strategy exclusions, report content)
  is MACHINE-VERIFIED against the official ADO 2021 PDF (S-01, see
  docs/standards/ADO_VERIFICATION.md). The overheating criteria are inherited from
  uk_tm59_2017 v1.0.0, itself machine-verified against the official TM59:2017 PDF
  (S-02) — consistent with ADO's own reference list citing TM59 [2017]. Compliance
  mode is therefore permitted for this pack; note ADO's binding §2.6 overrides below.

weather_note: >-
  ADO 2021 does NOT name a weather file, epoch or percentile anywhere in its text
  (machine-verified negative finding). The weather requirement is inherited from the
  referenced TM59:2017 methodology (DSY1, 2020s, high emissions, 50th percentile).
  OverheatLens states this inheritance explicitly and never cites ADO directly for
  weather-file requirements.

assessment:
  period: may_to_september
  hour_basis: 8760
  months: [5, 9]
  note: "Dynamic route per ADO §2.1-2.6: TM59:2017 assessment with ADO-specific limits."

space_types:
  living:
    aliases: [living room, lounge, kitchen, kitchen diner, open plan living kitchen]
    criteria: [a, mv]
  bedroom:
    aliases: [bedroom, master bedroom, single bedroom, double bedroom, twin bedroom]
    criteria: [a, b, mv]
  other:
    aliases: [circulation, hall, study, home office]
    criteria: [corridor]

criteria: []   # criteria inherited in full from uk_tm59_2017 (see engine inheritance)

model_limits:
  - id: PO-WIN-01
    clause: "ADO §2.6(a)"
    requirement: >-
      Day-occupied hours (08:00-23:00): openings start to open above 22 degC internal,
      fully open above 26 degC, start to close below 26 degC, fully closed below
      22 degC.
    parameters: {start_open_c: 22.0, fully_open_c: 26.0, day_start_hour: 8, day_end_hour: 23}
    verification: {source: S-01, status: source_verified}
  - id: PO-WIN-02
    clause: "ADO §2.6(b)"
    requirement: >-
      Night (23:00-08:00): openings modelled fully open only if first floor or above,
      not easily accessible, AND internal temperature exceeds 23 degC at 23:00.
    parameters: {night_threshold_c_at_23: 23.0}
    verification: {source: S-01, status: source_verified}
  - id: PO-WIN-03
    clause: "ADO §2.6(c)"
    requirement: >-
      Unoccupied ground-floor or easily-accessible rooms: day openings open only if it
      can be done securely (ADO §3.7); night openings modelled closed.
    verification: {source: S-01, status: source_verified}
  - id: PO-WIN-04
    clause: "ADO §2.6(d)"
    requirement: "An entrance door must be included in the model and modelled shut at all times."
    verification: {source: S-01, status: source_verified}
  - id: PO-OVR-01
    clause: "ADO §2.5-2.6 (relationship to TM59 §3.3)"
    requirement: >-
      ADO §2.6 limits OVERRIDE the more permissive TM59:2017 §3.3 window-opening
      choices. Where the two differ, the ADO rule governs a Part O submission.
    verification: {source: S-01, status: source_verified}

strategy_exclusions:
  - id: PO-EXC-01
    clause: "ADO §2.8"
    requirement: "Internal blinds and curtains must NOT be counted towards overheating mitigation."
    verification: {source: S-01, status: source_verified}
  - id: PO-EXC-02
    clause: "ADO §2.9"
    requirement: "Foliage / tree cover must NOT be counted towards solar-gain mitigation."
    verification: {source: S-01, status: source_verified}

report_requirements:
  - "ADO §2.4: report must demonstrate the building passes CIBSE TM59 assessment; contents per TM59 §2.3"
  - "ADO Appendix B Part 2b.1: dynamic software name and version; weather file location used incl. any additional more extreme weather files; number of sample units modelled and selection rationale"
  - "ADO Appendix B Part 2b.2: occupancy, equipment and opening profiles"
  - "ADO Appendix B Part 2b.3: free areas, infiltration and mechanical flow rates, window g-value, shading strategy, mechanical cooling"

changelog:
  - "1.0.0 (2026-08-28): criteria inherited from source-verified uk_tm59_2017 v1.0.0 (adaptive a, 32-h b, mv fixed method, advisory corridor); source_status flipped to source_verified on the strength of machine-verified S-01 (ADO) + S-02 (TM59:2017). Added PO-OVR-01 override-relationship note."
  - "0.1.0-dev (2026-08-28): created from machine-verified ADO 2021 text (S-01) with then-unverified inherited criteria."
