rule_pack: uk_tm52
version: 0.1.0-dev
title: "CIBSE TM52: The limits of overheating risk (operational analysis, 2013)"
publisher: CIBSE
edition: "2013"
source_status: secondary_pending
source_refs: [S-04]
verification_note: >-
  Scaffold only. TM52's three criteria and adaptive comfort basis are widely published
  in secondary literature, but this project has not yet transcribed them at full numeric
  fidelity, and the original document is not yet acquired. Evaluation is NOT implemented;
  criterion D of TM59:2017 reports NOT_EVALUATED rather than silently passing.

weather_requirements:
  family: "CIBSE DSY (as applicable per TM52 practice)"
  verified: false

assessment:
  period: full_year
  hour_basis: 8760
  note: "Operational (adaptive) analysis; occupied-hours based."

space_types:
  occupied_non_domestic:
    aliases: [circulation, hall, study, home office, classroom, office]
    criteria: [TM52-1, TM52-2, TM52-3]

criteria:
  - id: TM52-1
    applies_to: [occupied_non_domestic]
    clause: "TM52 Criterion 1 (hours of exceedance) — pending transcription"
    metric: not_transcribed
    window: occupied_hours
    aggregation: percent_of_annual_hours
    threshold: 0
    units: percent
    operator: ">"
    not_implemented: true
    interpretation_note: >-
      Widely reported as: hours with operative temperature >= comfort + 1 K exceeding
      3% of annual occupied hours. Threshold left at 0 (inert) until source-verified;
      implementation deliberately absent.
    verification: {source: S-04, status: secondary_pending}

  - id: TM52-2
    applies_to: [occupied_non_domestic]
    clause: "TM52 Criterion 2 (weighted exceedance) — pending transcription"
    metric: not_transcribed
    window: occupied_hours
    aggregation: weighted_exceedance
    threshold: 0
    units: none
    operator: ">"
    not_implemented: true
    interpretation_note: >-
      Widely reported as We = sum(hf) + 2*sum(hw) <= 6. Left inert until
      source-verified; implementation deliberately absent.
    verification: {source: S-04, status: secondary_pending}

  - id: TM52-3
    applies_to: [occupied_non_domestic]
    clause: "TM52 Criterion 3 (absolute limit) — pending transcription"
    metric: not_transcribed
    window: occupied_hours
    aggregation: max_delta
    threshold: 0
    units: kelvin
    operator: ">"
    not_implemented: true
    interpretation_note: >-
      Widely reported as: operative temperature must not exceed comfort temperature
      + 4 K at any time. Left inert until source-verified.
    verification: {source: S-04, status: secondary_pending}

changelog:
  - "0.1.0-dev (2026-08-28): honest scaffold; no implementation, no transcribed thresholds."
